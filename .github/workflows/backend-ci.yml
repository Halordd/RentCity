name: Backend CI

on:
  pull_request:
    paths:
      - "back-end/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - develop
      - developer/back-end
      - stagging
    paths:
      - "back-end/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rentcity?schema=public
      JWT_SECRET: ci-jwt-secret
      PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Install
        run: npm ci

      - name: Run backend quality gate
        run: npm run ci
