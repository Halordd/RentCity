name: RentCity CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - developer/front-end
      - developer/back-end
      - stagging
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rentcity-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect workspaces
    runs-on: ubuntu-latest
    outputs:
      has_frontend: ${{ steps.paths.outputs.has_frontend }}
      has_backend: ${{ steps.paths.outputs.has_backend }}
      has_e2e: ${{ steps.paths.outputs.has_e2e }}
      has_production_package: ${{ steps.paths.outputs.has_production_package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project folders
        id: paths
        shell: bash
        run: |
          [[ -f front-end/package.json ]] && echo "has_frontend=true" >> "$GITHUB_OUTPUT" || echo "has_frontend=false" >> "$GITHUB_OUTPUT"
          [[ -f back-end/package.json ]] && echo "has_backend=true" >> "$GITHUB_OUTPUT" || echo "has_backend=false" >> "$GITHUB_OUTPUT"
          [[ -f package.json && -f playwright.config.ts ]] && echo "has_e2e=true" >> "$GITHUB_OUTPUT" || echo "has_e2e=false" >> "$GITHUB_OUTPUT"
          [[ -f docker-compose.production.yml && -f .env.production.example ]] && echo "has_production_package=true" >> "$GITHUB_OUTPUT" || echo "has_production_package=false" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend quality gate
    needs: detect
    if: needs.detect.outputs.has_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front-end
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck, lint, and production build
        run: npm run check

  backend:
    name: Backend quality gate
    needs: detect
    if: needs.detect.outputs.has_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rentcity
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rentcity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: back-end
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rentcity?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-change-before-production
      PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret
      FRONTEND_ORIGINS: http://localhost:4174,http://127.0.0.1:4174
      API_DOCS_ENABLED: "true"
      NODE_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate and apply database migrations
        run: |
          npm run prisma:generate
          npm run prisma:validate
          npm run prisma:deploy

      - name: Typecheck, lint, build, unit test, and audit
        run: npm run ci

      - name: Verify API contract is current
        run: npm run openapi:check

  production_security:
    name: Production security gate
    needs:
      - detect
      - backend
    if: always() && needs.detect.outputs.has_backend == 'true' && needs.detect.outputs.has_e2e == 'true' && needs.backend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rentcity
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rentcity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rentcity?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-production-jwt-secret-must-be-long-and-not-default
      PAYMENT_WEBHOOK_SECRET: ci-production-payment-webhook-secret
      FRONTEND_ORIGINS: http://localhost:4174
      API_DOCS_ENABLED: "false"
      NODE_ENV: production
      E2E_BACKEND_URL: http://localhost:4000
      E2E_SKIP_WEB_SERVER: "true"
      E2E_PRODUCTION_SECURITY: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            back-end/package-lock.json

      - name: Install root E2E dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: back-end
        run: npm ci

      - name: Prepare backend database
        working-directory: back-end
        run: |
          npm run prisma:generate
          npm run prisma:deploy
          npm run seed

      - name: Build backend
        working-directory: back-end
        run: npm run build

      - name: Start backend API in production mode
        working-directory: back-end
        run: |
          npm run start:prod > ../backend-production.log 2>&1 &
          echo $! > ../backend-production.pid

      - name: Wait for backend readiness
        shell: bash
        run: |
          for _ in {1..60}; do
            if curl -fsS "$E2E_BACKEND_URL/health/ready"; then
              exit 0
            fi
            sleep 1
          done
          cat backend-production.log
          exit 1

      - name: Run production security tests
        run: npx playwright test e2e/production-security.spec.ts --project=desktop

      - name: Upload production backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-security-backend-log
          path: backend-production.log
          if-no-files-found: ignore

  e2e:
    name: Full-stack E2E
    needs:
      - detect
      - frontend
      - backend
    if: always() && needs.detect.outputs.has_frontend == 'true' && needs.detect.outputs.has_backend == 'true' && needs.detect.outputs.has_e2e == 'true' && needs.frontend.result == 'success' && needs.backend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rentcity
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rentcity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rentcity?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-change-before-production
      PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret
      FRONTEND_ORIGINS: http://localhost:4174,http://127.0.0.1:4174
      API_DOCS_ENABLED: "true"
      NODE_ENV: development
      E2E_BACKEND_URL: http://localhost:4000
      E2E_FRONTEND_URL: http://localhost:4174
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            front-end/package-lock.json
            back-end/package-lock.json

      - name: Install root E2E dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: front-end
        run: npm ci

      - name: Install backend dependencies
        working-directory: back-end
        run: npm ci

      - name: Prepare backend database
        working-directory: back-end
        run: |
          npm run prisma:generate
          npm run prisma:deploy
          npm run seed

      - name: Build backend
        working-directory: back-end
        run: npm run build

      - name: Start backend API
        working-directory: back-end
        run: |
          npm run start:prod > ../backend.log 2>&1 &
          echo $! > ../backend.pid

      - name: Wait for backend readiness
        shell: bash
        run: |
          for _ in {1..60}; do
            if curl -fsS "$E2E_BACKEND_URL/health/ready"; then
              exit 0
            fi
            sleep 1
          done
          cat backend.log
          exit 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E test suite
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            backend.log
          if-no-files-found: ignore

  production_package:
    name: Production Docker package
    needs:
      - detect
      - frontend
      - backend
    if: always() && needs.detect.outputs.has_production_package == 'true' && needs.frontend.result == 'success' && needs.backend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production compose file
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml config

      - name: Build production frontend and backend images
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml build frontend backend

  release_readiness:
    name: Release readiness
    needs:
      - frontend
      - backend
      - production_security
      - e2e
      - production_package
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required gates passed
        shell: bash
        run: |
          echo "frontend=${{ needs.frontend.result }}"
          echo "backend=${{ needs.backend.result }}"
          echo "production-security=${{ needs.production_security.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          echo "production-package=${{ needs.production_package.result }}"

          [[ "${{ needs.frontend.result }}" == "success" ]]
          [[ "${{ needs.backend.result }}" == "success" ]]
          [[ "${{ needs.production_security.result }}" == "success" ]]
          [[ "${{ needs.e2e.result }}" == "success" ]]
          [[ "${{ needs.production_package.result }}" == "success" ]]
