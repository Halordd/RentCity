services:
  postgres:
    image: postgres:16-alpine
    container_name: rentcity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rentcity
    ports:
      - "5432:5432"
    volumes:
      - rentcity-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rentcity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rentcity-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rentcity-redis-data:/data

volumes:
  rentcity-postgres-data:
  rentcity-redis-data:
